<div class="row justify-content-center">
  {{ range site.Data.funders }}
  <div class="col-6 col-md-3 mb-4 d-flex">
    <div class="funder-card w-100">
      <img src="/funders/{{ .logo }}" alt="{{ .name }}">
      <a href="{{ .url }}" target="_blank" rel="noopener">{{ .name }}</a>
    </div>
  </div>
  {{ end }}
</div>
